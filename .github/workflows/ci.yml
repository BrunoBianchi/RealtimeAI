name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which parts changed: the Windows build (~10 min) and the Linux core build
  # only run when native code, the build system or CI itself changed.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "native=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "$files"
          if grep -qE '^(src/|tests/|cmake/|CMakeLists\.txt|CMakePresets\.json|\.github/workflows/(ci|build-windows)\.yml)' <<<"$files"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Commits, secrets and flags
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Commit messages (Conventional Commits)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
          else
            npx commitlint --last --verbose
          fi
      - run: npm run check:secrets
      - run: npm run flags:validate
      - name: Versioning scripts
        run: npm run test:scripts
      - name: Next versions from the commits
        run: node scripts/version.mjs --json --pre beta | tee -a "$GITHUB_STEP_SUMMARY"

  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
        working-directory: apps/dashboard
      - name: Compiled CSS is up to date
        working-directory: apps/dashboard
        run: |
          npm run build:css
          git diff --exit-code -- src/renderer/styles.css
      - run: npm test
        working-directory: apps/dashboard

  core-linux:
    name: Core (Linux, GCC)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake --preset linux -DRTAI_WARNINGS_AS_ERRORS=ON
      - run: cmake --build --preset linux
      - run: ctest --preset linux

  windows:
    name: Windows (MSVC, full build)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      publish: false
