# Reusable: native overlay + tests, then (optionally) the Electron installer.
name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        description: "Semver of this build (2.1.0, 2.1.0-beta.3). Empty = dev build, cannot publish"
        type: string
        default: ""
      channel:
        description: "stable | beta"
        type: string
        default: stable
      publish:
        description: "Build the installer and publish it"
        type: boolean
        default: false
    secrets:
      RELEASES_TOKEN:
        required: false
      GOOGLE_OAUTH_CLIENT_JSON:
        required: false

# Permissions come from the caller (CI: read-only; Release/Beta: contents write).
jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: A published build needs a version
        if: inputs.publish && inputs.version == ''
        run: |
          echo "::error::publish=true requires the version input"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for the release notes

      - name: Cache ONNX Runtime and GoogleTest downloads
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/*.cmake') }}

      - name: Configure
        shell: pwsh
        run: |
          $extra = @("-DRTAI_GIT_COMMIT=${{ github.sha }}")
          if ("${{ inputs.version }}") { $extra += "-DRTAI_VERSION_STRING=${{ inputs.version }}" }
          cmake --preset windows-release @extra
      - name: Build
        run: cmake --build --preset windows-release
      - name: Test
        run: ctest --preset windows-release
      - name: The exe reports the release version
        if: inputs.version != ''
        shell: pwsh
        run: |
          $v = (& build/bin/Release/rtai_app.exe --version | Out-String).Trim()
          if ($v -ne "RealTimeAI ${{ inputs.version }}") { throw "rtai_app --version says '$v'" }
          (Get-Item build/bin/Release/rtai_app.exe).VersionInfo | Format-List ProductVersion, FileVersion

      - uses: actions/setup-node@v7
        if: inputs.publish
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Stage native overlay and build info
        if: inputs.publish
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          $native = "apps/dashboard/native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          Copy-Item build/bin/Release/rtai_app.exe $native/
          if (Test-Path build/bin/Release/onnxruntime.dll) { Copy-Item build/bin/Release/onnxruntime.dll $native/ }
          if ($env:GOOGLE_OAUTH_CLIENT_JSON) { Set-Content -Path apps/dashboard/google_oauth_client.json -Value $env:GOOGLE_OAUTH_CLIENT_JSON -NoNewline }
          # Remote feature flags: the copy flags.yml publishes to the releases
          # repository, or the file on this repository's main branch.
          $flagsUrl = if ($env:RELEASES_REPO) { "https://raw.githubusercontent.com/$($env:RELEASES_REPO)/main/flags.json" }
                      else { "https://raw.githubusercontent.com/${{ github.repository }}/main/apps/dashboard/flags.json" }
          @{ version = "${{ inputs.version }}"; channel = "${{ inputs.channel }}"; commit = "${{ github.sha }}";
             flagsUrl = $flagsUrl } |
            ConvertTo-Json | Set-Content apps/dashboard/build-info.json

      - name: Set installer version
        if: inputs.publish
        working-directory: apps/dashboard
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      # electron-builder puts assets/release-notes.md into the release and the
      # update metadata, so the in-app updater shows what changed.
      - name: Release notes
        if: inputs.publish
        shell: bash
        run: |
          since=""
          if [ "${{ inputs.channel }}" = "stable" ]; then since="--since-stable"; fi
          node scripts/version.mjs notes $since --version "${{ inputs.version }}" > apps/dashboard/assets/release-notes.md
          cat apps/dashboard/assets/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build and publish installer
        if: inputs.publish
        working-directory: apps/dashboard
        shell: pwsh
        env:
          # Releases repo (public, for auto-update) when configured; otherwise
          # the installer is attached to this repository's release.
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build:css
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $beta = "${{ inputs.channel }}" -eq "beta"
          $type = if ($beta) { "prerelease" } else { "release" }
          $targetRepo = if ($env:RELEASES_REPO -and $env:RELEASES_TOKEN) { $env:RELEASES_REPO } else { "${{ github.repository }}" }
          $owner, $name = $targetRepo.Split('/')

          npx electron-builder --win nsis --x64 --publish never `
            "-c.publish.owner=$owner" "-c.publish.repo=$name" "-c.publish.releaseType=$type"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $assets = @(Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' } | ForEach-Object FullName)
          if ($assets.Count -eq 0) {
            echo "::error::No installer or update metadata (.exe, .yml, .blockmap) found in apps/dashboard/release"
            exit 1
          }

          # 1. Always attach installer + electron-updater metadata (latest.yml, beta.yml, .blockmap) to this repository's release
          $env:GH_TOKEN = $env:GITHUB_TOKEN
          gh release view "v$version" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            $flags = @("v$version", "--repo", "${{ github.repository }}", "--verify-tag", "--title", "RealTimeAI $version", "--notes-file", "assets/release-notes.md")
            if ($beta) { $flags += "--prerelease" } else { $flags += "--latest" }
            gh release create @flags
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload "v$version" @assets --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # 2. If a dedicated public RELEASES_REPO is configured with a token, mirror the release and update metadata there too
          if ($env:RELEASES_REPO -and $env:RELEASES_TOKEN -and ($env:RELEASES_REPO -ne "${{ github.repository }}")) {
            $env:GH_TOKEN = $env:RELEASES_TOKEN
            gh release view "v$version" --repo "$env:RELEASES_REPO" *> $null
            if ($LASTEXITCODE -ne 0) {
              $rFlags = @("v$version", "--repo", "$env:RELEASES_REPO", "--title", "RealTimeAI $version", "--notes-file", "assets/release-notes.md")
              if ($beta) { $rFlags += "--prerelease" } else { $rFlags += "--latest" }
              gh release create @rFlags
            }
            gh release upload "v$version" @assets --repo "$env:RELEASES_REPO" --clobber
          }

      - uses: actions/upload-artifact@v7
        with:
          name: realtimeai-windows-${{ inputs.channel }}${{ inputs.version != '' && format('-{0}', inputs.version) || '' }}
          path: |
            build/bin/Release/rtai_app.exe
            build/bin/Release/onnxruntime.dll
            apps/dashboard/release/*.exe
            apps/dashboard/release/*.yml
          if-no-files-found: ignore
          retention-days: 14
