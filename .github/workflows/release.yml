# main: release-please keeps a "chore(release): vX.Y.Z" PR up to date with the
# next version and CHANGELOG.md. Merging it tags the release and builds and
# publishes the Windows installer.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # GitHub only lets Actions open PRs when "Allow GitHub Actions to create
      # and approve pull requests" is on (Settings > Actions > General). A
      # RELEASE_PLEASE_TOKEN secret (fine-grained PAT: Contents + Pull requests
      # read/write on this repository) works even with it off, and also lets
      # the release PR trigger CI, which PRs opened by GITHUB_TOKEN do not.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  installer:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      channel: stable
      publish: true
    secrets: inherit
