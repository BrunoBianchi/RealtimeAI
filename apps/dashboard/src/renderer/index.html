<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lipcue.com — Interview Copilot</title>
    <link rel="icon" type="image/png" href="../../assets/icon.png" />
    <link rel="stylesheet" href="vendor/driver/driver.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Navigation">
        <div class="sidebar-body">
          <div class="brand">
            <div class="brand-logo" aria-label="LipCue">

              </svg>
              <svg class="brand-logo-collapsed-svg" viewBox="18 10 110 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <g transform="translate(0 8)">
                  <path d="M22 34C22 22.954 30.954 14 42 14H101C112.046 14 121 22.954 121 34V78C121 89.046 112.046 98 101 98H65L40 120V98H42C30.954 98 22 89.046 22 78V34Z" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M49 53V65" stroke="var(--text-strong)" stroke-width="8" stroke-linecap="round"/>
                  <path d="M69 42V76" stroke="var(--text-strong)" stroke-width="8" stroke-linecap="round"/>
                  <path d="M89 49V69" stroke="var(--accent)" stroke-width="8" stroke-linecap="round"/>

                </g>
              </svg>
            </div>
            <span class="pill ok" id="engineStatusPill" title="Copilot status"><span class="dot"></span><span id="engineStatusLabel">Ready</span></span>
          </div>

          <button type="button" class="btn primary" id="btnNewSession" data-action="new-session" title="New session">
            <span class="new-session-main"><span data-icon="plus"></span><span class="new-session-label">New session</span></span><span class="kbd-inset">Ctrl N</span>
          </button>

          <nav class="nav" id="sideNav" aria-label="Navigation"></nav>

          <div class="sidebar-section" id="sidebarNext"></div>
          <button type="button" class="usage-card" id="sidebarUsage" data-action="go" data-to="settings/plan"></button>
        </div>

        <div class="sidebar-foot">
          <div class="row sidebar-account">
            <button type="button" class="profile-row" id="profileRow" data-action="go" data-to="profile" aria-label="Profile">
              <span class="avatar" id="profileInitials">—</span>
              <span class="profile-meta">
                <span id="profileName" class="truncate">—</span>
                <span id="profilePlan" class="faint">—</span>
              </span>
              <span data-icon="dots-three" class="faint"></span>
            </button>
            <button type="button" class="icon-btn" id="sidebarSignOut" data-action="cloud-logout" title="Sign out" aria-label="Sign out" hidden><span data-icon="sign-out"></span></button>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="crumb"><span class="muted">lipcue.com</span><span class="sep">/</span><span id="crumb">Home</span></div>
          <button type="button" class="search-trigger" id="searchTrigger" data-action="open-palette" title="Search (Ctrl+K)">
            <span data-icon="magnifying-glass"></span>
            <span class="truncate">Search sessions, files, questions…</span>
            <span class="kbd">Ctrl K</span>
          </button>
          <div class="topbar-actions">
            <button type="button" class="btn raised" id="btnUpdateChip" data-action="go" data-to="settings/updates" hidden></button>
            <button type="button" class="btn raised icon-only" id="btnTour" data-action="start-tour" title="Guided tour of this screen"><span data-icon="question"></span></button>
            <button type="button" class="btn raised" id="btnStealthChip" data-action="toggle-stealth" title="Hide the panel from recordings and screen sharing (Ctrl+Alt+S)"></button>
            <button type="button" class="btn raised" id="btnGoLive" data-action="go" data-to="live"></button>
            <div class="win-controls">
              <button type="button" class="win-btn" data-win="minimize" title="Minimize"><span data-icon="minus"></span></button>
              <button type="button" class="win-btn" data-win="maximize" title="Maximize"><span data-icon="square"></span></button>
              <button type="button" class="win-btn close" data-win="close" title="Close"><span data-icon="x"></span></button>
            </div>
          </div>
        </header>

        <div class="content" id="content">
          <div id="view"></div>
        </div>
      </main>
    </div>

    <div id="modalRoot"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="i18n.js"></script>
    <script src="locales/pt-BR.js"></script>
    <script src="icons.js"></script>
    <script src="app.js"></script>
    <script src="views.js"></script>
    <script src="coding_answer.js"></script>
    <script src="live.js"></script>
    <script src="settings.js"></script>
    <script src="orb.js"></script>
    <script src="mock_timing.js"></script>
    <script src="mock.js"></script>
    <script src="referral.js"></script>
    <script src="pair.js"></script>
    <script src="profile.js"></script>
    <script src="modals.js"></script>
    <script src="auth.js"></script>
    <script src="vendor/driver/driver.iife.js"></script>
    <script src="tour.js"></script>
  </body>
</html>
