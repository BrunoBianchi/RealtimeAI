<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cue — Interview Copilot</title>
    <link rel="icon" type="image/png" href="../../assets/icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Navegação">
        <div class="brand">
          <div class="brand-mark" data-icon="waveform"></div>
          <span class="brand-name">Cue</span>
          <span class="pill ok" id="engineStatusPill" title="Status do copiloto"><span class="dot"></span><span id="engineStatusLabel">Pronto</span></span>
        </div>

        <button type="button" class="btn primary lg" id="btnNewSession" data-action="new-session" title="Nova sessão">
          <span data-icon="plus"></span><span class="new-session-label">Nova sessão</span>
        </button>

        <nav class="nav" id="sideNav"></nav>

        <div class="sidebar-section" id="sidebarNext"></div>

        <div class="sidebar-foot">
          <button type="button" class="usage-card" id="sidebarUsage" data-action="go" data-to="settings/plan"></button>
          <button type="button" class="profile-row" id="profileRow" data-action="open-profile">
            <span class="avatar" id="profileInitials">—</span>
            <span class="profile-meta stack gap-4" style="gap: 0; line-height: 1.3">
              <span id="profileName" class="truncate" style="font-size: 13px">—</span>
              <span id="profilePlan" class="faint" style="font-size: 11.5px">—</span>
            </span>
            <span data-icon="dots-three" class="faint ml-auto" style="font-size: 16px"></span>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="crumb"><span class="muted">Cue</span><span class="sep">/</span><span id="crumb">Início</span></div>
          <button type="button" class="search-trigger" data-action="open-palette" title="Buscar (Ctrl+K)">
            <span data-icon="magnifying-glass"></span>
            <span class="truncate">Buscar sessões, arquivos, perguntas…</span>
            <span class="kbd">Ctrl K</span>
          </button>
          <div class="topbar-actions">
            <button type="button" class="btn raised" id="btnUpdateChip" data-action="go" data-to="settings/updates" hidden></button>
            <button type="button" class="btn raised" id="btnStealthChip" data-action="toggle-stealth" title="Ocultar o painel de gravações e compartilhamento (Ctrl+Alt+S)"></button>
            <button type="button" class="btn raised" id="btnGoLive" data-action="go" data-to="live"></button>
            <div class="win-controls">
              <button type="button" class="win-btn" data-win="minimize" title="Minimizar"><span data-icon="minus"></span></button>
              <button type="button" class="win-btn" data-win="maximize" title="Maximizar"><span data-icon="square"></span></button>
              <button type="button" class="win-btn close" data-win="close" title="Fechar"><span data-icon="x"></span></button>
            </div>
          </div>
        </header>

        <div class="content" id="content">
          <div id="view"></div>
        </div>
      </main>
    </div>

    <div id="modalRoot"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="icons.js"></script>
    <script src="app.js"></script>
    <script src="views.js"></script>
    <script src="live.js"></script>
    <script src="settings.js"></script>
    <script src="modals.js"></script>
  </body>
</html>
