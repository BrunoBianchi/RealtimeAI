<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cue — Interview Copilot</title>
    <link rel="icon" type="image/png" href="../../assets/icon.png" />
    <link rel="stylesheet" href="vendor/driver/driver.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Navigation">
        <div class="brand">
          <div class="brand-mark" data-icon="waveform"></div>
          <span class="brand-name">Cue</span>
          <span class="pill ok" id="engineStatusPill" title="Copilot status"><span class="dot"></span><span id="engineStatusLabel">Ready</span></span>
        </div>

        <button type="button" class="btn primary lg" id="btnNewSession" data-action="new-session" title="New session">
          <span data-icon="plus"></span><span class="new-session-label">New session</span>
        </button>

        <nav class="nav" id="sideNav"></nav>

        <div class="sidebar-section" id="sidebarNext"></div>

        <div class="sidebar-foot">
          <button type="button" class="usage-card" id="sidebarUsage" data-action="go" data-to="settings/plan"></button>
          <div class="row" style="gap: 4px">
          <button type="button" class="profile-row grow" style="min-width: 0" id="profileRow" data-action="open-profile">
            <span class="avatar" id="profileInitials">—</span>
            <span class="profile-meta stack gap-4" style="gap: 0; line-height: 1.3">
              <span id="profileName" class="truncate" style="font-size: 13px">—</span>
              <span id="profilePlan" class="faint" style="font-size: 11.5px">—</span>
            </span>
            <span data-icon="dots-three" class="faint ml-auto" style="font-size: 16px"></span>
          </button>
          <button type="button" class="icon-btn" id="sidebarSignOut" data-action="cloud-logout" title="Sign out" aria-label="Sign out" hidden><span data-icon="sign-out"></span></button>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="crumb"><span class="muted">Cue</span><span class="sep">/</span><span id="crumb">Home</span></div>
          <button type="button" class="search-trigger" id="searchTrigger" data-action="open-palette" title="Search (Ctrl+K)">
            <span data-icon="magnifying-glass"></span>
            <span class="truncate">Search sessions, files, questions…</span>
            <span class="kbd">Ctrl K</span>
          </button>
          <div class="topbar-actions">
            <button type="button" class="btn raised" id="btnUpdateChip" data-action="go" data-to="settings/updates" hidden></button>
            <button type="button" class="btn raised icon-only" id="btnTour" data-action="start-tour" title="Guided tour of this screen"><span data-icon="question"></span></button>
            <button type="button" class="btn raised" id="btnStealthChip" data-action="toggle-stealth" title="Hide the panel from recordings and screen sharing (Ctrl+Alt+S)"></button>
            <button type="button" class="btn raised" id="btnGoLive" data-action="go" data-to="live"></button>
            <div class="win-controls">
              <button type="button" class="win-btn" data-win="minimize" title="Minimize"><span data-icon="minus"></span></button>
              <button type="button" class="win-btn" data-win="maximize" title="Maximize"><span data-icon="square"></span></button>
              <button type="button" class="win-btn close" data-win="close" title="Close"><span data-icon="x"></span></button>
            </div>
          </div>
        </header>

        <div class="content" id="content">
          <div id="view"></div>
        </div>
      </main>
    </div>

    <div id="modalRoot"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="i18n.js"></script>
    <script src="locales/pt-BR.js"></script>
    <script src="icons.js"></script>
    <script src="app.js"></script>
    <script src="views.js"></script>
    <script src="live.js"></script>
    <script src="settings.js"></script>
    <script src="modals.js"></script>
    <script src="auth.js"></script>
    <script src="vendor/driver/driver.iife.js"></script>
    <script src="tour.js"></script>
  </body>
</html>
