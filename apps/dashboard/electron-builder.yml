# Windows installer + auto-update metadata.
# The native overlay is staged into ./native first (CI: build-windows.yml,
# locally: scripts/windows/package.bat). Updates come from this repository's
# GitHub releases; CI points publish at vars.RELEASES_REPO when it is set.
appId: com.raiado.realtimeai
productName: lipcue.com
executableName: lipcue
copyright: Copyright © 2026 Bruno Raiado Bianchi

directories:
  output: release
  buildResources: assets

files:
  - package.json
  - flags.json
  - assets/**/*
  - src/main/**/*
  - src/preload/**/*
  - src/renderer/**/*
  - "!src/renderer/tailwind.input.css"
  # Written by CI; optional in local builds.
  - build-info.json
  - google_oauth_client.json

# The C++ overlay (rtai_app.exe + any DLLs) lives next to app.asar.
extraResources:
  - from: native
    to: native
    filter: ["**/*"]

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
  artifactName: lipcue-Setup-${version}.${ext}

nsis:
  # A wizard: the window opens right away and shows progress (one-click shows
  # nothing until it is done, which looks like the installer did not run).
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: lipcue.com

# Stable releases also write beta.yml, so beta testers get stable builds too.
generateUpdatesFilesForAllChannels: true

publish:
  provider: github
  owner: BrunoBianchi
  repo: RealtimeAI
  releaseType: release
