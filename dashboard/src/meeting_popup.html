<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
<title>RealTimeAI · Meeting detected</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #16161d;
    --muted: #6b6b76;
    --border: #e6e6ea;
    --card: #f6f6f8;
    --primary: #2563eb;
    --primary-fg: #ffffff;
    --primary-hover: #1d4ed8;
    --ghost-hover: #ededf0;
    --live: #e11d48;
    --track: #ececf0;
    --focus: rgba(37, 99, 235, 0.45);
  }
  :root[data-theme="dark"] {
    --bg: #15151a;
    --fg: #f4f4f5;
    --muted: #a1a1aa;
    --border: #2a2a31;
    --card: #1c1c22;
    --primary: #60a5fa;
    --primary-fg: #0b1220;
    --primary-hover: #93c5fd;
    --ghost-hover: #24242b;
    --live: #f43f5e;
    --track: #24242b;
    --focus: rgba(96, 165, 250, 0.5);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    overflow: hidden;
  }
  .wrap { position: relative; padding: 14px 16px 16px; border: 1px solid var(--border); border-radius: 8px; }
  .top { display: flex; align-items: center; gap: 8px; -webkit-app-region: drag; }
  .brand { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--muted); flex: 1; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 var(--live); animation: pulse 1.8s ease-out infinite; }
  .ended .pulse { background: var(--muted); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(244,63,94,.55); } 80%,100% { box-shadow: 0 0 0 7px rgba(244,63,94,0); } }
  .x { -webkit-app-region: no-drag; border: 0; background: transparent; color: var(--muted); width: 24px; height: 24px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
  .x:hover { background: var(--ghost-hover); color: var(--fg); }
  .head { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
  .badge { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff; flex: none; }
  .titles { min-width: 0; }
  .kicker { font-size: 11px; color: var(--muted); }
  .app { font-size: 16px; font-weight: 650; margin-top: 1px; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 290px; }
  .field { margin-top: 14px; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  select {
    width: 100%; height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--fg); font: inherit; outline: none; cursor: pointer;
  }
  select:focus-visible, button:focus-visible { box-shadow: 0 0 0 3px var(--focus); outline: none; }
  .note { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid transparent; font: inherit; font-weight: 600; cursor: pointer; }
  .btn-primary { flex: 1; background: var(--primary); color: var(--primary-fg); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary[disabled] { opacity: .7; cursor: default; }
  .btn-ghost { background: transparent; color: var(--fg); border-color: var(--border); }
  .btn-ghost:hover { background: var(--ghost-hover); }
  .kbd { font-size: 10px; font-weight: 600; opacity: .75; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
  .links { display: flex; justify-content: space-between; margin-top: 12px; }
  .link { border: 0; background: none; padding: 0; font: inherit; font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .link:hover { color: var(--fg); text-decoration: underline; }
  .error { margin-top: 10px; font-size: 12px; color: var(--live); display: none; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--track); border-radius: 0 0 8px 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: var(--primary); transform-origin: left; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; display: none; }
  .busy .spin { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top">
    <span class="pulse" aria-hidden="true"></span>
    <span class="brand">RealTimeAI</span>
    <button class="x" id="btnClose" type="button" aria-label="Close" title="Close (Esc)">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="head">
    <div class="badge" id="badge">M</div>
    <div class="titles">
      <div class="kicker" id="kicker">Meeting detected</div>
      <div class="app" id="appName">Meeting</div>
      <div class="sub" id="subtitle"></div>
    </div>
  </div>

  <!-- Started: pick the goal and launch the copilot -->
  <div id="paneStart">
    <div class="field">
      <label for="selGoal">Goal</label>
      <select id="selGoal"></select>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btnStart" type="button">
        <span class="spin" aria-hidden="true"></span>
        <span id="btnStartLabel">Start copilot</span>
        <span class="kbd" aria-hidden="true">Enter</span>
      </button>
      <button class="btn btn-ghost" id="btnLater" type="button">Not now</button>
    </div>
    <div class="links">
      <button class="link" id="btnMute" type="button">Don't ask for this app</button>
      <button class="link" id="btnDashboard" type="button">Open dashboard</button>
    </div>
  </div>

  <!-- Ended: the copilot is still on -->
  <div id="paneEnded" hidden>
    <div class="note">The copilot is still running. Stop it to save the session and its summary.</div>
    <div class="actions">
      <button class="btn btn-primary" id="btnStop" type="button">
        <span class="spin" aria-hidden="true"></span>
        <span id="btnStopLabel">Stop copilot</span>
      </button>
      <button class="btn btn-ghost" id="btnKeep" type="button">Keep running</button>
    </div>
  </div>

  <div class="error" id="error" role="alert"></div>
  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
</div>

<script>
  const BRAND = {
    meet: ['#1e8e3e', 'M'], teams: ['#5b5fc7', 'T'], zoom: ['#0b5cff', 'Z'], skype: ['#0078d4', 'S'],
    discord: ['#5865f2', 'D'], slack: ['#4a154b', 'S'], webex: ['#00a0d1', 'W'], whatsapp: ['#25d366', 'W'],
    telegram: ['#229ed9', 'T'], signal: ['#3a76f0', 'S'], goto: ['#f68d2e', 'G'], ringcentral: ['#f80', 'R'],
    bluejeans: ['#2d6cdf', 'B'], chime: ['#232f3e', 'C'], jitsi: ['#1d76ba', 'J'], whereby: ['#7a5af8', 'W'],
    gather: ['#5f6bd8', 'G'], around: ['#111', 'A'], livestorm: ['#00c48c', 'L'], bbb: ['#283274', 'B'],
    riverside: ['#6a3cf6', 'R'], streamyard: ['#e1306c', 'S'], viber: ['#7360f2', 'V']
  };
  const $ = (id) => document.getElementById(id);
  let data = null;
  let timer = null;
  let remaining = 0;
  let total = 0;
  let paused = false;
  let busy = false;

  function setCountdown(seconds) {
    total = remaining = seconds * 1000;
    clearInterval(timer);
    const tick = 100;
    timer = setInterval(() => {
      if (paused || busy) return;
      remaining -= tick;
      $('barFill').style.transform = `scaleX(${Math.max(0, remaining / total)})`;
      if (remaining <= 0) {
        clearInterval(timer);
        window.rtaiPopup.dismiss({ reason: 'timeout' });
      }
    }, tick);
  }

  function showError(msg) {
    const el = $('error');
    el.textContent = msg || '';
    el.style.display = msg ? 'block' : 'none';
    requestResize();
  }

  function requestResize() {
    requestAnimationFrame(() => window.rtaiPopup.resize(Math.ceil($('wrap').getBoundingClientRect().height)));
  }

  function render(d) {
    data = d;
    busy = false;
    document.documentElement.dataset.theme = d.theme === 'dark' ? 'dark' : 'light';
    const m = d.meeting || {};
    const [color, letter] = BRAND[m.id] || ['#2563eb', (m.name || 'M').charAt(0).toUpperCase()];
    $('badge').style.background = color;
    $('badge').textContent = letter;
    $('appName').textContent = m.name || 'Meeting';
    const sub = m.title && m.title.toLowerCase() !== String(m.name || '').toLowerCase() ? m.title : '';
    $('subtitle').textContent = sub;
    $('subtitle').title = sub;
    $('subtitle').hidden = !sub;
    const ended = d.kind === 'ended';
    $('wrap').classList.toggle('ended', ended);
    $('kicker').textContent = ended ? 'Meeting ended' : 'Meeting detected';
    $('paneStart').hidden = ended;
    $('paneEnded').hidden = !ended;
    $('btnMute').textContent = `Don't ask for ${m.name || 'this app'}`;
    showError('');

    if (!ended) {
      const sel = $('selGoal');
      sel.innerHTML = '';
      const agents = Array.isArray(d.agents) ? d.agents : [];
      if (!agents.length) {
        const o = document.createElement('option');
        o.value = '';
        o.textContent = 'No goal yet · general copilot';
        sel.appendChild(o);
      }
      for (const a of agents) {
        const o = document.createElement('option');
        o.value = a.id;
        const extra = [a.company, a.role].filter(Boolean).join(' · ');
        o.textContent = extra ? `${a.name} · ${extra}` : a.name;
        if (a.id === d.defaultAgentId) o.selected = true;
        sel.appendChild(o);
      }
      $('btnStart').classList.remove('busy');
      $('btnStart').disabled = false;
      $('btnStartLabel').textContent = 'Start copilot';
      setCountdown(d.timeoutSec || 45);
      setTimeout(() => $('btnStart').focus({ preventScroll: true }), 50);
    } else {
      $('btnStop').classList.remove('busy');
      $('btnStop').disabled = false;
      $('btnStopLabel').textContent = 'Stop copilot';
      setCountdown(d.timeoutSec || 30);
    }
    requestResize();
  }

  async function start() {
    if (busy || !data || data.kind === 'ended') return;
    busy = true;
    $('btnStart').disabled = true;
    $('btnStart').classList.add('busy');
    $('btnStartLabel').textContent = 'Starting…';
    showError('');
    try {
      const res = await window.rtaiPopup.start($('selGoal').value || '');
      if (!res || !res.ok) throw new Error((res && res.error) || 'The overlay did not start.');
      // main closes the popup
    } catch (err) {
      busy = false;
      $('btnStart').disabled = false;
      $('btnStart').classList.remove('busy');
      $('btnStartLabel').textContent = 'Try again';
      showError(err.message || String(err));
    }
  }

  async function stop() {
    if (busy) return;
    busy = true;
    $('btnStop').disabled = true;
    $('btnStop').classList.add('busy');
    $('btnStopLabel').textContent = 'Saving session…';
    try { await window.rtaiPopup.stop(); } catch (_e) {}
  }

  $('btnStart').addEventListener('click', start);
  $('btnStop').addEventListener('click', stop);
  $('btnLater').addEventListener('click', () => window.rtaiPopup.dismiss({ reason: 'later' }));
  $('btnKeep').addEventListener('click', () => window.rtaiPopup.dismiss({ reason: 'keep' }));
  $('btnClose').addEventListener('click', () => window.rtaiPopup.dismiss({ reason: 'close' }));
  $('btnMute').addEventListener('click', () => window.rtaiPopup.dismiss({ reason: 'mute' }));
  $('btnDashboard').addEventListener('click', () => window.rtaiPopup.openDashboard());
  $('selGoal').addEventListener('change', () => { remaining = total; });
  document.addEventListener('mouseenter', () => { paused = true; });
  document.addEventListener('mouseleave', () => { paused = false; });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.rtaiPopup.dismiss({ reason: 'close' });
    else if (e.key === 'Enter') {
      // A focused button handles Enter as its own click.
      const tag = document.activeElement ? document.activeElement.tagName : '';
      if (tag === 'BUTTON' || tag === 'SELECT') return;
      if (data && data.kind === 'ended') stop(); else start();
    }
  });

  window.rtaiPopup.onData(render);
  window.rtaiPopup.ready();
</script>
</body>
</html>
