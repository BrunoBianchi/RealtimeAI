# Windows installer + auto-update metadata.
# CI (build-windows.yml) overrides publish.owner/repo with the public
# releases repository, and stages the native overlay into ./native first.
appId: com.raiado.realtimeai
productName: RealTimeAI
copyright: Copyright © 2026 Bruno Raiado Bianchi

directories:
  output: release
  buildResources: assets

files:
  - main.js
  - preload.js
  - feature_flags.js
  - updater.js
  - flags.json
  - google_calendar.js
  - meeting_detector.js
  - meeting_popup.js
  - meeting_popup_preload.js
  - pdf_text.js
  - assets/**/*
  - src/**/*
  - "!src/tailwind.input.css"
  # Written by CI; optional in local builds.
  - build-info.json
  - google_oauth_client.json

# The C++ overlay (rtai_app.exe + any DLLs) lives next to app.asar.
extraResources:
  - from: native
    to: native
    filter: ["**/*"]

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
  artifactName: RealTimeAI-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  shortcutName: RealTimeAI

# Stable releases also write beta.yml, so beta testers get stable builds too.
generateUpdatesFilesForAllChannels: true

publish:
  provider: github
  owner: CHANGE_ME_GITHUB_USER
  repo: realtimeai-releases
  releaseType: release
